[project]
name = "notice-fixture"
version = "0.1.0"
description = "A per jurisdiction, per form regression harness for tax compliance agents - the release gate that lets Warp's AI agents file faster and prov"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tarun Aditya Kusupati" }
]
dependencies = []

[project.scripts]
notice-fixture = "notice_fixture.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
